<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قائمة المستخدمين</title>
    <link rel="stylesheet" href="./css/style.css">
    <style>
        /* التنسيقات الخاصة بقائمة المستخدمين */
        .users-list-wrapper { 
            padding: 20px; 
            overflow-y: auto; 
            flex: 1; 
        }
        
        .user-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            padding: 16px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }

        .user-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 15px rgba(16, 185, 129, 0.1);
            border-color: var(--primary);
        }

        /* تصميم الأيقونة الدائرية وحالة الاتصال */
        .avatar-container {
            position: relative; /* ضروري لضبط موضع نقطة الاتصال */
            flex-shrink: 0;
        }

        .custom-avatar {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: #f1f5f9;
            color: #94a3b8;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            border: 2px solid #e2e8f0;
            transition: 0.3s;
        }

        .user-card:hover .custom-avatar {
            border-color: var(--primary);
            color: var(--primary);
            background: #ecfdf5;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .default-avatar {
            width: 26px;
            height: 26px;
        }

        /* نقطة الاتصال (Offline افتراضياً) */
        .status-dot {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #cbd5e1; /* لون رمادي لغير المتصل */
            border: 2px solid #ffffff;
            transition: 0.3s;
        }

        /* كلاس الأونلاين (يضاف بالجافاسكربت) */
        .status-dot.online {
            background: var(--success, #10b981); /* لون أخضر */
            box-shadow: 0 0 5px rgba(16, 185, 129, 0.5);
        }

        /* نصوص الاسم والإيميل */
        .user-row-info {
            flex: 1;
        }

        .user-row-name {
            font-weight: 700;
            color: #0f172a;
            font-size: 1.1rem;
            margin-bottom: 4px;
        }

        .user-row-sub {
            font-size: 0.85rem;
            color: #64748b;
        }

        /* أيقونة المحادثة */
        .chat-action-icon {
            margin-right: auto; 
            color: var(--primary);
            opacity: 0;
            transform: translateX(-10px);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #ecfdf5;
        }

        .user-card:hover .chat-action-icon {
            opacity: 1;
            transform: translateX(0);
        }
    </style>
</head>
<body>

    <div class="chat-wrapper">
        <div class="chat-container">
            <div class="chat-header">
                <h3>المستخدمين المسجلين</h3>
                <button id="logoutBtn" class="logout-btn">تسجيل الخروج</button>
            </div>

            <div class="users-list-wrapper" id="usersList">
                <p style="text-align: center; color: #64748b;">جاري تحميل المستخدمين...</p>
            </div>
        </div>
    </div>

    <!-- مكتبة SignalR ضرورية هنا للتواصل مع الـ Hub من هذه الصفحة -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
    
    <script src="./js/config.js"></script>
    <script src="./js/auth.js"></script>
    <script src="./js/api.js"></script>
    <script src="./js/users.js"></script>
</body>
</html>
