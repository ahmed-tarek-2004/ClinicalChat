<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المستخدمين | صيدليتك</title>
    <link rel="stylesheet" href="./css/style.css">
    <style>
        .users-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .users-container {
            width: 100%;
            max-width: 520px;
            height: 92vh;
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
            border: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .users-header {
            padding: 20px 24px;
            border-bottom: 1px solid #f1f5f9;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ffffff;
        }
        .users-header h3 {
            margin: 0;
            font-size: 1.2rem;
            color: #0f172a;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .users-header h3 svg {
            color: var(--primary);
        }
        .users-list-wrapper {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }
        .users-list-wrapper::-webkit-scrollbar { width: 6px; }
        .users-list-wrapper::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        .user-card {
            background: #ffffff;
            border: 1px solid #f1f5f9;
            padding: 14px 16px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            margin-bottom: 10px;
            position: relative;
        }
        .user-card:hover {
            transform: translateY(-2px) scale(1.01);
            border-color: #bbf7d0;
            box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.1);
        }

        .avatar-container {
            position: relative;
            flex-shrink: 0;
        }
        .custom-avatar {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background: linear-gradient(135deg, #ecfdf5, #d1fae5);
            color: var(--primary);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            border: 2px solid #ecfdf5;
            transition: 0.3s;
            font-weight: 700;
            font-size: 1.1rem;
        }
        .user-card:hover .custom-avatar {
            border-color: var(--primary);
            transform: scale(1.05);
        }
        .avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .status-dot {
            position: absolute;
            bottom: -2px;
            left: -2px;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #cbd5e1;
            border: 2.5px solid #ffffff;
            transition: 0.3s;
        }
        .status-dot.online {
            background: #10b981;
            box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2);
        }

        .user-row-info {
            flex: 1;
        }
        .user-row-name {
            font-weight: 700;
            color: #0f172a;
            font-size: 1rem;
            margin-bottom: 3px;
        }
        .user-row-sub {
            font-size: 0.8rem;
            color: #94a3b8;
            font-weight: 500;
        }

        .chat-action-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: #f0fdf4;
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transform: scale(0.8);
            transition: all 0.2s ease;
        }
        .user-card:hover .chat-action-icon {
            opacity: 1;
            transform: scale(1);
        }

        .logout-btn {
            padding: 8px 16px;
            background: #fef2f2;
            color: #ef4444;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
        }
        .logout-btn:hover { background: #fee2e2; }
    </style>
</head>
<body>

    <div class="users-page">
        <div class="users-container">
            <div class="users-header">
                <h3>
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                        <circle cx="9" cy="7" r="4"></circle>
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                    </svg>
                    المستخدمين
                </h3>
                <button id="logoutBtn" class="logout-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                    خروج
                </button>
            </div>

            <div class="users-list-wrapper" id="usersList">
                <p style="text-align: center; color: #94a3b8; padding: 40px;">جاري تحميل المستخدمين...</p>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
    <script src="./js/config.js"></script>
    <script src="./js/auth.js"></script>
    <script src="./js/api.js"></script>
    <script src="./js/users.js"></script>
</body>
</html>
