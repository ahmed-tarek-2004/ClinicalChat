<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المحادثة | صيدليتك</title>
    <link rel="stylesheet" href="./css/style.css">
    <style>
        .chat-page-bg {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .chat-container {
            height: 92vh;
            max-width: 900px;
            width: 100%;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.12);
            background: #ffffff;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid #e2e8f0;
        }

        .chat-header {
            background: #ffffff;
            padding: 16px 24px;
            border-bottom: 1px solid #f1f5f9;
            display: flex;
            align-items: center;
            gap: 16px;
            z-index: 10;
        }

        .back-btn {
            background: #f8fafc;
            border: none;
            color: #64748b;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 12px;
            transition: all 0.25s ease;
        }

        .back-btn:hover {
            background: #f1f5f9;
            color: var(--primary);
            transform: translateX(-2px);
        }

        .header-info {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .header-avatar {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, var(--primary), var(--primary2));
            color: white;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.2rem;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
            position: relative;
        }

        .header-text h3 {
            margin: 0;
            font-size: 1.1rem;
            font-weight: 700;
            color: #0f172a;
        }

        .header-text span {
            font-size: 0.8rem;
            color: #94a3b8;
            font-weight: 500;
        }

        .chat-messages {
            flex: 1;
            background: linear-gradient(180deg, #f8fafc 0%, #f0fdf4 100%);
            padding: 24px;
            gap: 6px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            position: relative;
        }

        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        .chat-messages::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        .message-row {
            display: flex;
            width: 100%;
            margin-bottom: 4px;
            animation: messageSlide 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .message-row.sent {
            justify-content: flex-start;
        }

        .message-row.received {
            justify-content: flex-end;
        }

        @keyframes messageSlide {
            from {
                opacity: 0;
                transform: translateY(12px) scale(0.96);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .message {
            max-width: 75%;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        @media (max-width: 640px) {
            .message {
                max-width: 88%;
            }
        }

        .message-content {
            padding: 14px 18px;
            font-size: 1rem;
            line-height: 1.6;
            word-wrap: break-word;
            position: relative;
        }

        .message.received .message-content {
            background: #ffffff;
            color: #1e293b;
            border-radius: 20px 20px 4px 20px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .message.sent .message-content {
            background: linear-gradient(135deg, var(--primary), #059669);
            color: #ffffff;
            border-radius: 20px 20px 20px 4px;
            box-shadow: 0 4px 16px rgba(16, 185, 129, 0.2);
        }

        .message-meta {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 4px;
            padding: 0 6px;
            font-size: 0.72rem;
            color: #94a3b8;
            font-weight: 500;
        }

        .message.sent .message-meta {
            justify-content: flex-start;
            color: #86efac;
        }

        .message.received .message-meta {
            justify-content: flex-end;
        }

        .message-actions {
            display: flex;
            align-items: center;
            gap: 4px;
            opacity: 0;
            transform: translateY(4px);
            transition: all 0.2s ease;
            padding: 2px 6px;
        }

        .message-row:hover .message-actions {
            opacity: 1;
            transform: translateY(0);
        }

        .action-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #94a3b8;
            transition: all 0.2s ease;
        }

        .action-btn:hover {
            background: #fee2e2;
            color: #ef4444;
        }

        .action-btn svg {
            width: 16px;
            height: 16px;
        }

        .delete-confirm {
            display: none;
            align-items: center;
            gap: 8px;
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 12px;
            padding: 8px 14px;
            margin-top: 6px;
            font-size: 0.85rem;
            color: #991b1b;
            animation: fadeIn 0.2s ease;
        }

        .delete-confirm.active {
            display: flex;
        }

        .delete-confirm span {
            flex: 1;
            font-weight: 600;
        }

        .delete-confirm button {
            border: none;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            transition: 0.2s;
        }

        .delete-confirm .confirm-yes {
            background: #ef4444;
            color: white;
        }

        .delete-confirm .confirm-yes:hover {
            background: #dc2626;
        }

        .delete-confirm .confirm-no {
            background: white;
            color: #64748b;
            border: 1px solid #e2e8f0;
        }

        .delete-confirm .confirm-no:hover {
            background: #f8fafc;
        }

        .chat-input-area {
            background: #ffffff;
            padding: 16px 24px;
            border-top: 1px solid #f1f5f9;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        #messageInput {
            flex: 1;
            background: #f8fafc;
            border: 2px solid transparent;
            border-radius: 20px;
            padding: 14px 20px;
            font-size: 1rem;
            transition: all 0.3s ease;
            color: #0f172a;
            font-family: inherit;
        }

        #messageInput:focus {
            background: #ffffff;
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.1);
        }

        #messageInput::placeholder {
            color: #cbd5e1;
        }

        .send-btn-circle {
            background: linear-gradient(135deg, var(--primary), var(--primary2));
            color: white;
            border: none;
            border-radius: 16px;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            flex-shrink: 0;
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
        }

        .send-btn-circle:hover {
            transform: scale(1.08) rotate(-8deg);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
        }

        .send-btn-circle:active {
            transform: scale(0.95);
        }

        .empty-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #cbd5e1;
            gap: 12px;
        }

        .empty-chat svg {
            width: 64px;
            height: 64px;
            opacity: 0.5;
        }

        .empty-chat p {
            font-size: 0.95rem;
            color: #94a3b8;
        }

        .header-status {
            position: absolute;
            bottom: -2px;
            left: -2px;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #cbd5e1;
            border: 2.5px solid #ffffff;
            transition: all 0.3s ease;
        }

        .header-status.online {
            background: #10b981;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
        }

        .logout-btn {
            padding: 8px 16px;
            background: #fef2f2;
            color: #ef4444;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .logout-btn:hover {
            background: #fee2e2;
            transform: translateY(-1px);
        }

        .logout-btn svg {
            width: 16px;
            height: 16px;
        }
    </style>
</head>

<body>

    <div class="chat-page-bg">
        <div class="chat-container">
            <div class="chat-header">
                <button id="backBtn" class="back-btn" title="رجوع للقائمة" onclick="window.location.href='users.html'">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M15 18l-6-6 6-6" />
                    </svg>
                </button>

                <div class="header-info">
                    <div class="header-avatar" id="chatAvatar">
                        <span id="avatarInitial">؟</span>
                        <div class="header-status" id="chatStatus" title="غير متصل"></div>
                    </div>
                    <div class="header-text">
                        <h3 id="chatWith">جاري التحميل...</h3>
                        <span>صيدلية إلكترونية</span>
                    </div>
                </div>

                <button id="logoutBtn" class="logout-btn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                    خروج
                </button>
            </div>

            <div class="chat-messages" id="chatMessages">
                <div class="empty-chat" id="emptyState">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                    </svg>
                    <p>ابدأ المحادثة مع الصيدلية</p>
                </div>
            </div>

            <form class="chat-input-area" id="chatForm">
                <input type="text" id="messageInput" placeholder="اكتب رسالتك هنا..." required autocomplete="off">
                <button type="submit" class="send-btn-circle" title="إرسال">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                        stroke-linecap="round" stroke-linejoin="round" style="transform: translateX(-1px);">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </form>
        </div>
        <audio id="msgSound" preload="auto">
            <source src="https://assets.mixkit.co/active_storage/sfx/2354/2354-preview.mp3" type="audio/mpeg">
        </audio>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
    <script src="./js/config.js"></script>
    <script src="./js/auth.js"></script>
    <script src="./js/api.js"></script>
    <script src="./js/chat.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const targetName = urlParams.get('name');
        if (targetName) {
            document.getElementById('chatWith').innerText = targetName;
            document.getElementById('avatarInitial').innerText = targetName.charAt(0).toUpperCase();
        }
    </script>
</body>

</html>
